name: AI CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  # ─── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Ghim phiên bản: bộ luật khai báo ở ruff.toml, bản Ruff mới không được tự đổi kết quả CI
      - name: Install Ruff
        run: pip install ruff==0.16.9

      - name: Lint with Ruff
        run: ruff check .

      - name: Check syntax
        run: python -m compileall -q app

  # ─── Job 2: Docker build check ───────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: smashcourt-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
