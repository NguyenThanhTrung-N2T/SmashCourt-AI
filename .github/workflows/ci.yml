name: AI CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  # ─── Job 1: Lint + test + quét lỗ hổng ───────────────────────────────────────
  lint:
    name: Lint (Ruff), Test, Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Ghim phiên bản: bộ luật khai báo ở ruff.toml, bản Ruff mới không được tự đổi kết quả CI
      - name: Install Ruff
        run: pip install ruff==0.16.9

      - name: Lint with Ruff
        run: ruff check .

      - name: Check syntax
        run: python -m compileall -q app

      # AI-UT-01…05: LLM giả (tests/conftest.py), không gọi Gemini thật, không cần GEMINI_API_KEY
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # JUnit XML mang mã danh mục của từng test (marker catalog) cho dashboard "Kiểm thử" (TADSS-Runtime/perf/board.py ci ai)
      - name: Run tests (pytest)
        run: python -m pytest -q --junitxml=test-results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-results
          path: test-results/

      # SEC-AI-4: gói Python có lỗ hổng đã biết (kể cả gói kéo theo) hoặc không quét được ⇒ job đỏ
      - name: Check vulnerable packages (pip-audit)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements-dev.txt --progress-spinner off

  # ─── Job 2: Docker image ─────────────────────────────────────────────────────
  # Epic 6C (6C-2a): build image MỘT lần ⇒ kiểm (không .env/file bí mật, non-root: SEC-AI-3; nhãn revision = sha) ⇒ đẩy đúng image đó lên GHCR.
  # Pull request: chỉ build + kiểm. Push master/develop: đẩy tag sha-<7> (bất biến, CD triển khai theo tag này) và tag nhánh.
  image:
    name: Docker Image (build, check, push GHCR)
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, check and push image
        env:
          GIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bash tools/ci/build-image.sh ghcr.io/nguyenthanhtrung-n2t/smashcourt-ai ${{ github.event_name == 'push' && '--push' || '' }}

  # Epic 6C (6C-2b): CD — push develop/master ⇒ runner trên máy deploy kéo đúng image sha-<7> vừa đẩy, kiểm (đúng commit, health, smoke
  # chỉ đọc), hỏng thì tự quay về bản trước (SmashCourt-BE/deploy/cd.sh). Pull request không bao giờ chạy job này.
  deploy:
    name: Deploy (máy deploy)
    if: github.event_name == 'push'
    needs: image
    runs-on: [self-hosted, smashcourt-deploy]
    timeout-minutes: 15
    concurrency:
      group: deploy-ai
      cancel-in-progress: false

    steps:
      - name: Get deploy kit (SmashCourt-BE/deploy, nhánh develop)
        uses: actions/checkout@v4
        with:
          repository: NguyenThanhTrung-N2T/SmashCourt-BE
          ref: develop
          sparse-checkout: deploy

      - name: Deploy, verify, roll back on failure
        env:
          SHA: ${{ github.sha }}
        run: bash deploy/cd.sh ai "$SHA"
