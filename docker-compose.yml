services:
  ai:
    # Cùng tên image với CI (GHCR); `up --build` build tại chỗ thành tag `local`, `IMAGE_TAG=sha-xxxxxxx docker compose up ai` chạy đúng bản CI đã đẩy (Epic 6C, P6-33)
    image: ghcr.io/nguyenthanhtrung-n2t/smashcourt-ai:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    container_name: smashcourt-ai
    ports:
      # Chỉ máy này (SEC-AI-1): BE và ngrok-ai gọi AI trong mạng Docker; AI chưa có xác thực nên không mở ra mạng LAN
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - smashcourt-network

  ngrok-ai:
    image: ngrok/ngrok:latest
    container_name: smashcourt-ngrok-ai
    ports:
      - "4041:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http ai:8000
    networks:
      - smashcourt-network
    depends_on:
      - ai
    restart: unless-stopped

networks:
  smashcourt-network:
    name: smashcourt-network
    external: true
