[pytest]
# Test của SmashCourt-AI (Epic 6C, AI-UT-01…05): không gọi Gemini thật, client được thay bằng LLM giả trong tests/conftest.py
testpaths = tests
pythonpath = .
# Mã danh mục kiểm thử (methodology Mục 4.16) của từng test; conftest ghi vào JUnit XML để dashboard "Kiểm thử" gom theo mã
markers =
    catalog(*codes): mã danh mục kiểm thử của test, vd catalog("AI-UT-02")
# xunit1: định dạng JUnit có <properties> cho từng testcase (xunit2 bỏ record_property)
junit_family = xunit1
